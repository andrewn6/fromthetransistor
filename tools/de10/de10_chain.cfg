# de10-nano jtag chain: the cyclone v fpga and the hps arm dap, in the
# order openocd's target/altera_fpgasoc.cfg declares them. the idcodes
# are the documented ones for 5csea6/5cseba6 and the hps dap; confirm
# them against `de10.sh detect` on the real board before trusting flash.
jtag newtap de10.fpga tap -irlen 10 -ircapture 0x01 -irmask 0x3 -expected-id 0x02d020dd
jtag newtap de10.hps dap -irlen 4 -ircapture 0x01 -irmask 0x0f -expected-id 0x4ba00477
