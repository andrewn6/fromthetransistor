# the de10-nano's on-board usb-blaster ii (mini-usb port J13).
# it enumerates as 09fb:6810 with no firmware; openocd uploads
# blaster_6810.hex (from quartus) and it comes back as 09fb:6010.
adapter driver usb_blaster
usb_blaster vid_pid 0x09fb 0x6010 0x09fb 0x6810
usb_blaster lowlevel_driver ublast2
usb_blaster firmware $env(DE10_FIRMWARE)
adapter speed 6000
transport select jtag
